[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genlayer-doctor"
version = "0.1.0"
description = "Pre-deploy checks and transaction diagnostics for GenLayer Intelligent Contracts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["genlayer", "genvm", "intelligent-contracts", "linter", "devtools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gldoctor = "genlayer_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits a real GenLayer node (set GLDOCTOR_LIVE=1)"]
